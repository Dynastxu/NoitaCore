name: DataGen Check

on:
  pull_request:
    branches: [ main, dev ]
    paths:
      - 'src/main/java/dynastxu/noitacore/datagen/**'
      - 'src/generated/**'
  push:
    branches: [ main, dev ]
    paths:
      - 'src/main/java/dynastxu/noitacore/datagen/**'
      - 'src/generated/**'

jobs:
  verify-datagen:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Cache Gradle dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('*.gradle', 'gradle/**/*.gradle', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run NeoForge Data Generation
        run: ./gradlew runData

      - name: Check for uncommitted changes
        run: |
          if [[ -n $(git status --porcelain) ]]; then
            echo "::error::CHECK FAILED: Data generation produced uncommitted changes!"
            echo "Please run './gradlew runData' locally and commit the generated files."
            echo ""
            echo "========== Changed files =========="
            git status --porcelain
            echo ""
            echo "========== Diff stat =========="
            git diff --stat
            echo ""
            echo "========== Full diff =========="
            git diff
            exit 1
          else
            echo "CHECK SUCCESSFUL: All generated files are up to date!"
          fi
